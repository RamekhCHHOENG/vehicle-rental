# Development. Compose merges this over docker-compose.yml automatically, so
# plain `docker compose up` is the dev stack — both apps hot-reload, the Go API
# through air and Nuxt through Vite. Naming a file explicitly skips this one,
# which is how deployments get production.
services:
  postgres:
    ports:
      # Bound to the loopback interface on purpose. Docker's default publishes
      # on 0.0.0.0, which puts the database on the public internet if the host
      # is reachable. 5434 on the host: 5432 is usually taken by another local
      # Postgres.
      - "127.0.0.1:5434:5432"

  api:
    build:
      target: dev
    volumes:
      - ./backend:/app
      # Keep the container's build cache off the host mount.
      - api_tmp:/app/tmp
      # Uploads land in the working tree during development, where you can look
      # at them, rather than in the named volume the deployed stack uses.
      - ./backend/uploads:/app/uploads
    ports:
      - "127.0.0.1:8090:8080"
    healthcheck:
      # air compiles on first start, which takes longer than a prebuilt binary.
      start_period: 60s

  web:
    build:
      target: dev
    volumes:
      - ./frontend:/app
      # Linux-built modules must not be overwritten by the host's macOS ones.
      - web_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  api_tmp:
  web_node_modules:
