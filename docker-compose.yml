# The deployed stack. `docker compose up` does NOT run this alone — it merges
# docker-compose.override.yml on top and gives you the development stack with
# hot reload. Anything that names a file explicitly (`-f docker-compose.yml`,
# which is what a PaaS does) gets production: compiled binary, prebuilt Nitro
# output, no source mounted in, no host ports.
#
# That split is deliberate. The development services mount ./backend and
# ./frontend over the images and run air and Vite against them; a PaaS builds
# from a checkout it then throws away, so those mounts land on empty
# directories and the containers die on startup while the deploy still reports
# success.
#
# No reverse proxy here either. A PaaS supplies one; on a bare VPS add Caddy
# with docker-compose.prod.yml.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carrental}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env — see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-carrental}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carrental}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    environment:
      API_PORT: "8080"
      DB_URL: host=postgres port=5432 user=${POSTGRES_USER:-carrental} password=${POSTGRES_PASSWORD:?set it in .env — see .env.example} dbname=${POSTGRES_DB:-carrental} sslmode=disable
      # No fallbacks: a default secret in a public repo is not a secret.
      JWT_SECRET: ${JWT_SECRET:?set it in .env — see .env.example}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set it in .env — see .env.example}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set it in .env — see .env.example}
      # The origin the visitor's browser loads the site from — the only one CORS
      # lets through, so a wrong value fails every request from the real site.
      # The session cookie is SameSite=Lax, so when the API answers on its own
      # domain that domain has to sit under the same registrable domain as this
      # one (api.example.com beside yan.example.com is fine; an unrelated domain
      # drops the cookie and login stops working).
      WEB_ORIGIN: ${WEB_ORIGIN:?set it in .env — see .env.example}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped
    environment:
      # Browser-facing, so it has to resolve from the visitor's machine.
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:?set it in .env — see .env.example}
      # Server-side rendering reaches the API over the compose network instead.
      NUXT_API_INTERNAL: http://api:8080
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  uploads:
