services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carrental}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carrental_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-carrental}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carrental}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      target: dev
    environment:
      API_PORT: "8080"
      DB_URL: host=postgres port=5432 user=${POSTGRES_USER:-carrental} password=${POSTGRES_PASSWORD:-carrental_dev_password} dbname=${POSTGRES_DB:-carrental} sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-do-not-use-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@carrental.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    ports:
      - "8090:8080"
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8090}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules

volumes:
  pgdata:
  web_node_modules:
