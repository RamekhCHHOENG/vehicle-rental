<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- The Yan mark: a licence plate whose checkmark breaks through the top
       edge. Plate in mid-petrol so it reads on light and dark tab bars. -->
  <mask id="m">
    <rect width="48" height="48" fill="white"/>
    <path d="M12 28 L19.5 35 L41 10" stroke="black" stroke-width="12" stroke-linecap="round" fill="none"/>
  </mask>
  <rect x="3" y="16" width="42" height="26" rx="6" fill="none" stroke="#7f9a94" stroke-width="4.2" mask="url(#m)"/>
  <path d="M12 28 L19.5 35 L41 10" stroke="#f2a93b" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
