# Adds HTTPS to the deployed stack on a bare VPS — a server with nothing on it
# but Docker. Layer it over the base file:
#
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Caddy fronts one domain and splits /api and /uploads off to the API, so
# WEB_ORIGIN and NUXT_PUBLIC_API_BASE are both just https://yourdomain.com.
# Edit deploy/Caddyfile with that domain first.
#
# A PaaS runs its own proxy and must NOT get this file — two things would fight
# over ports 80 and 443. There, docker-compose.yml alone is the deployment.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  caddy_data:
  caddy_config:
